services:
  # ======================
  # MongoDB Database
  # ======================
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME:-inverser_db}
    volumes:
      - mongo_data:/data/db
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ======================
  # FastAPI Backend
  # ======================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB_NAME=${MONGO_DB_NAME}
      - DB_NAME=${MONGO_DB_NAME}
      - FRONTEND_URL=${FRONTEND_URL}
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ADMIN_PASSWORDS=${ADMIN_PASSWORDS}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app_net
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ======================
  # React Frontend (Nginx)
  # ======================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Empty string = use same origin (nginx proxies /api to backend)
        - REACT_APP_BACKEND_URL=
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app_net
    expose:
      - "80"

networks:
  app_net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
