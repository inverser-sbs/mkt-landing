services:
  # ======================
  # MongoDB Database
  # ======================
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME:-inverser_db}
    volumes:
      - mongo_data:/data/db
    networks:
      - app_net

  # ======================
  # FastAPI Backend
  # ======================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - MONGO_DB_NAME=${MONGO_DB_NAME:-inverser_db}
      - DB_NAME=${MONGO_DB_NAME:-inverser_db}
      - FRONTEND_URL=${FRONTEND_URL}
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - ADMIN_PASSWORDS=${ADMIN_PASSWORDS:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - uploads_data:/app/backend/uploads
    depends_on:
      - mongo
    networks:
      - app_net
    expose:
      - "8000"

  # ======================
  # React Frontend (Nginx)
  # ======================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - REACT_APP_BACKEND_URL=
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - app_net
    expose:
      - "80"

networks:
  app_net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  uploads_data:
    driver: local
