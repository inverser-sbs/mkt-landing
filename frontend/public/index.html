        <title>MKT-Landing</title>
        <!-- 
          ResizeObserver Loop Error - ROOT CAUSE FIX
        -->
        <script>
            (function() {
                'use strict';
                var NativeResizeObserver = window.ResizeObserver;
                window.ResizeObserver = function(callback) {
                    var wrappedCallback = function(entries, observer) {
                        window.requestAnimationFrame(function() {
                            if (typeof callback === 'function') {
                                callback(entries, observer);
                            }
                        });
                    };
                    var observer = new NativeResizeObserver(wrappedCallback);
                    return observer;
                };
                window.ResizeObserver.prototype = NativeResizeObserver.prototype;
                window.ResizeObserver.toString = function() {
                    return NativeResizeObserver.toString();
                };
            })();
        </script>
